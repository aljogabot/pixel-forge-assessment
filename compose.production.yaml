x-app: &app
  image: prompt-edit-demo-app:latest
  build:
    context: .
    target: production
  env_file:
    - .env.production
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy

services:
  app:
    <<: *app

  web:
    image: prompt-edit-demo-web:latest
    build:
      context: .
      target: web
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - app

  worker:
    <<: *app
    command:
      - php
      - artisan
      - queue:work
      - --sleep=3
      - --tries=0
      - --timeout=30
      - --max-time=3600
    stop_grace_period: 60s

  scheduler:
    <<: *app
    command: ["php", "artisan", "schedule:work"]
    stop_grace_period: 60s

  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:?Set DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME:?Set DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:
